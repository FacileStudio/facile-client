name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Type-check
        run: bun run check

      - name: Package with types
        run: bun run build

  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: FacileStudio/filet@v0.18.2
        with:
          version: v0.18.2
          fail-on: error
